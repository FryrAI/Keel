# keel CI — GitHub Actions workflow
# Written to .github/workflows/keel.yml by `keel init`.
#
# One recipe. The maintained composite action installs keel, provisions the
# graph (cached on the merge-base commit, rebuilt with `keel map` on a miss),
# annotates the diff, and keeps ONE sticky comment on the pull request that it
# updates in place instead of re-posting.
#
#   pull_request -> keel review --base <merge base>: which contracts moved, and
#                   which callers the change left behind, plus the violations
#                   THIS diff introduced (never the repo's backlog).
#   push         -> keel compile --changed, and — the real payoff — the graph
#                   for this commit lands in the cache, so pull requests based
#                   on it start warm instead of paying for a full map.
name: keel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # the sticky review comment

jobs:
  keel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # keel review parses the base side of the diff straight out of git.
          # A shallow clone has no base side, and no merge base to key the
          # graph cache on.
          fetch-depth: 0

      - uses: FryrAI/Keel/.github/actions/keel@v0
        with:
          # review on pull_request, compile --changed on push.
          mode: auto

# keel CI — GitLab CI template
# Add this job to your .gitlab-ci.yml.
# Generated by `keel init` when GitLab CI is detected.
#
# GitLab has no equivalent of the maintained composite action, so this is the
# same recipe spelled out: build the graph, then report the diff. On a merge
# request `keel review` prints which contracts moved and which callers the
# change left behind, and `keel compile --since` gates the commits themselves.
keel:
  stage: test
  variables:
    # keel reads the base side of the diff out of git. GitLab clones 50 commits
    # deep by default, which may not reach the merge base.
    GIT_DEPTH: 0
  script:
    - curl -fsSL https://keel.engineer/install.sh | bash
    - keel map
    - >
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        keel review --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA";
        keel compile --since "$CI_MERGE_REQUEST_DIFF_BASE_SHA";
      else
        keel compile --changed;
      fi

name: "keel - Structural Code Enforcement"
description: "Install keel, provision its graph from cache, annotate the diff, and keep one sticky review comment on the PR"

# The one CI recipe. `keel init` scaffolds a workflow that calls this action and
# nothing else, so there is a single place to fix when the recipe changes —
# before this, keel's own scaffold ran `curl install.sh` + `keel map --strict`
# and a user following it never saw keel's annotations at all.

branding:
  icon: "shield"
  color: "blue"

inputs:
  version:
    description: "keel version to use (default: latest)"
    required: false
    default: "latest"
  mode:
    description: "'review' (two-sided graph diff + sticky comment), 'compile' (compile --changed), or 'auto': review on pull_request, compile otherwise"
    required: false
    default: "auto"
  args:
    description: "Full keel arguments, overriding `mode` entirely (e.g. 'compile --since HEAD~5'). Runs exactly this one command: no second review pass, no sticky comment"
    required: false
    default: ""
  comment:
    description: "Post/update the sticky PR comment in review mode"
    required: false
    default: "true"
  github-token:
    description: "GitHub token, used to download releases and to post the sticky comment"
    required: false
    default: ${{ github.token }}

outputs:
  violation-count:
    description: "Number of annotations keel emitted"
    value: ${{ steps.run.outputs.violation-count }}
  exit-code:
    description: "keel exit code"
    value: ${{ steps.run.outputs.exit-code }}
  summary:
    description: "Human-readable summary of results"
    value: ${{ steps.run.outputs.summary }}
  graph-sha:
    description: "The commit the graph used for this run describes"
    value: ${{ steps.graph.outputs.graph-sha }}

runs:
  using: "composite"
  steps:
    - name: Install keel
      shell: bash
      env:
        KEEL_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/entrypoint.sh install

    # Referenced by full repo path rather than `./.github/actions/keel-graph`:
    # a relative `uses:` inside a composite action resolves against the CALLING
    # repository's workspace, which does not contain this action.
    - name: Provision the graph
      id: graph
      uses: FryrAI/Keel/.github/actions/keel-graph@v0

    - name: Run keel
      id: run
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ARGS: ${{ inputs.args }}
        EVENT_NAME: ${{ github.event_name }}
        GRAPH_SHA: ${{ steps.graph.outputs.graph-sha }}
        # Scratch space outside the checkout: `keel review` diffs the working
        # tree, and CI output files have no business appearing in it.
        ANNOTATIONS: ${{ runner.temp }}/keel-annotations.txt
        REVIEW: ${{ runner.temp }}/keel-review.txt
      run: |
        set -uo pipefail

        mode="$MODE"
        if [ "$mode" = "auto" ]; then
          if [ "$EVENT_NAME" = "pull_request" ]; then mode="review"; else mode="compile"; fi
        fi

        # An explicit `args:` wins over `mode` — the escape hatch for anything
        # this action does not model. It becomes its OWN mode: the caller's
        # command IS the run, so the review plumbing below (the sticky comment
        # keyed on this output) must not fire on top of it just because the
        # event happened to be a pull_request.
        if [ -n "$ARGS" ]; then
          mode="custom"
          read -r -a cmd <<<"$ARGS"
        elif [ "$mode" = "review" ]; then
          cmd=(review --base "$GRAPH_SHA")
        elif [ "$mode" = "compile" ]; then
          cmd=(compile --changed)
        else
          echo "::error::unknown keel mode '$mode' (expected review, compile, or auto)"
          exit 2
        fi
        echo "mode=$mode" >>"$GITHUB_OUTPUT"

        # In review mode `keel review --annotations-file` writes this itself as
        # part of the one run below. Defensively create it up front anyway: if
        # `keel` fails before producing output (an unresolvable `--base`) or
        # the mode isn't review, nothing else guarantees the file exists, and
        # `cat`/`grep -c` on a missing file would fail the step for the wrong
        # reason.
        : >"$ANNOTATIONS"

        # `--format github`/`--annotations-file` make the binary emit the
        # annotations itself. That replaced an inline interpreter heredoc that
        # reshaped keel's JSON — an undeclared runtime dependency in a tool
        # whose Article 1 is "single binary, zero runtime dependencies". Keep
        # this step interpreter-free.
        #
        # Review mode drives both outputs from ONE `keel review` run:
        # `--annotations-file` writes the CI protocol to $ANNOTATIONS while
        # stdout (redirected to $REVIEW) still carries the primary rendering
        # for the sticky comment — no second, output-shaping-only invocation.
        # Every other mode keeps its single `--format github` run, unchanged.
        if [ "$mode" = "review" ]; then
          rm -f "$REVIEW"
          extra_args=(--annotations-file "$ANNOTATIONS")
          out_file="$REVIEW"
        else
          extra_args=(--format github)
          out_file="$ANNOTATIONS"
        fi

        # `|| exit_code=$?`, not a bare `$?` on the next line: composite bash
        # runs with implicit -e, so an ERROR-level keel exit would kill the
        # script HERE — annotations unposted, outputs unset, sticky comment
        # skipped — and the step would go red with nothing on it to read. The
        # assignment itself always exits 0, so -e never fires on this line.
        exit_code=0
        keel "${cmd[@]}" "${extra_args[@]}" >"$out_file" || exit_code=$?
        echo "exit-code=$exit_code" >>"$GITHUB_OUTPUT"

        # A review that could not run must leave no $REVIEW behind: an empty
        # file reads as "clean" to sticky_comment.sh, and it would say so
        # untruthfully. Non-review modes have nothing to clean up here — their
        # output lives in $ANNOTATIONS, which must survive a failure. An `if`
        # with no `else`, not `[ ... ] && rm -f`: the latter's exit status is
        # the test's when it's false, which would trip -e on every non-review
        # failure.
        if [ "$mode" = "review" ] && [ "$exit_code" -ne 0 ]; then
          rm -f "$REVIEW"
        fi

        # The annotations ARE the output: echoing them is what posts them.
        cat "$ANNOTATIONS"

        # One annotation per violation; a clean run prints nothing at all —
        # and `grep -c` exits 1 on that zero-match file, so without `|| true`
        # the implicit -e turned every CLEAN run into a silent exit-1 failure
        # (100% of pushes: `compile --changed` diffs a fresh checkout's
        # working tree against HEAD, which is empty by construction).
        violations="$(grep -c '^::' "$ANNOTATIONS" || true)"
        echo "violation-count=$violations" >>"$GITHUB_OUTPUT"

        if [ "$exit_code" -eq 0 ] && [ "$violations" -eq 0 ]; then
          summary="Clean — no violations"
        else
          summary="Found $violations violation(s)"
        fi
        echo "summary=$summary" >>"$GITHUB_OUTPUT"

        # In review mode the sticky comment is the report — $REVIEW is already
        # written above. Only the non-review modes need a step summary here.
        if [ "$mode" != "review" ]; then
          {
            echo "### keel ${cmd[0]}"
            echo ""
            echo "$summary"
            if [ "$violations" -gt 0 ]; then
              echo ""
              echo '```'
              cat "$ANNOTATIONS"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
        fi

        exit $exit_code

    # Restores the accumulated series so this run's snapshot lands as the next
    # point rather than the first one. Unlike the graph cache (see
    # `the_graph_cache_has_no_prefix_fallback`), a PREFIX restore-key is safe
    # here on purpose: every row upserts by `commit_sha`
    # (`insert_quality_snapshot`), so a stale prefix restore can only ever be
    # *missing* the newest point, never wrong about an existing one, and the
    # Quality snapshot step below re-exports the full current state on every
    # run regardless. Do not "fix" this into matching the graph cache's
    # no-prefix rule — the two caches have opposite failure modes.
    - name: Restore quality history
      if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/keel-quality-history.jsonl
        key: keel-quality-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          keel-quality-history-${{ runner.os }}-

    - name: Quality snapshot
      # One reading per merge on the default branch — the time axis `keel
      # quality --trend` reads. Push-only and default-branch-only: a pull
      # request's graph describes the merge base, not the merged result, so
      # snapshotting one would record a state that never existed.
      #
      # `always()`: a merge that carried violations is still a merge, and the
      # series must not develop holes wherever the build went red.
      #
      # The graph cache is keyed on the exact commit, so this commit's
      # fresh/restored graph.db never carries a prior commit's snapshot row on
      # its own — the history file restored above, imported here, and
      # re-exported below is what makes the series survive across runners.
      if: ${{ always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      shell: bash
      env:
        HISTORY: ${{ runner.temp }}/keel-quality-history.jsonl
      run: |
        set -uo pipefail

        if [ ! -f .keel/graph.db ]; then
          echo "keel: no graph to measure — skipping the quality snapshot"
          exit 0
        fi

        # A failed import is data loss, not a hiccup: the restored series is
        # dropped and this run's snapshot becomes point 1 of a new one, which
        # a reader of `--trend` cannot tell from a genuinely young repo. It
        # must therefore be an annotation, not an echo buried in the log — the
        # step still does not fail, because a lost series must not turn a
        # green merge red, and the engine's import stays strict.
        if [ -f "$HISTORY" ]; then
          keel quality --import "$HISTORY" \
            || echo "::warning::keel quality history import failed — starting a fresh series (previous history lost)"
        fi

        # ~10ms of graph work. `keel quality` never gates, and neither does
        # this step: a failed measurement must not turn a green merge red.
        reading="$(keel quality --snapshot --llm)" || reading=""
        if [ -n "$reading" ]; then
          echo "$reading"
          {
            echo "### keel quality"
            echo ""
            echo '```'
            echo "$reading"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
        fi

        keel quality --export "$HISTORY" || echo "keel: quality history export failed"

    - name: Save quality history
      if: ${{ always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/keel-quality-history.jsonl
        key: keel-quality-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Sticky review comment
      # `always()`: a red compile in review mode must still leave the report on
      # the PR, and a fork's read-only token must never turn into a red run.
      if: ${{ always() && inputs.comment == 'true' && steps.run.outputs.mode == 'review' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: ${{ github.action_path }}/sticky_comment.sh "${{ runner.temp }}/keel-review.txt"

name: "keel - Structural Code Enforcement"
description: "Run keel compile to enforce structural integrity in CI"

branding:
  icon: "shield"
  color: "blue"

inputs:
  version:
    description: "keel version to use (default: latest)"
    required: false
    default: "latest"
  args:
    description: "Arguments to pass to keel (default: compile --changed)"
    required: false
    default: "compile --changed"
  github-token:
    description: "GitHub token for downloading releases"
    required: false
    default: ${{ github.token }}

outputs:
  violation-count:
    description: "Number of violations found"
    value: ${{ steps.run.outputs.violation-count }}
  exit-code:
    description: "keel exit code"
    value: ${{ steps.run.outputs.exit-code }}
  summary:
    description: "Human-readable summary of results"
    value: ${{ steps.run.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Install keel
      shell: bash
      env:
        KEEL_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/entrypoint.sh install

    - name: Run keel
      id: run
      shell: bash
      run: |
        # `--format github` makes the binary emit the annotations itself. It
        # replaced an inline interpreter heredoc that reshaped keel's JSON — an
        # undeclared runtime dependency in a tool whose Article 1 is "single
        # binary, zero runtime dependencies". Keep this step interpreter-free.
        set +e
        output=$(keel ${{ inputs.args }} --format github 2>&1)
        exit_code=$?
        set -e
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"

        # The annotations ARE the output: echoing them is what posts them.
        printf '%s\n' "$output"

        # One annotation per violation; a clean run prints nothing at all.
        violations=$(printf '%s\n' "$output" | grep -c '^::' || true)
        echo "violation-count=$violations" >> "$GITHUB_OUTPUT"

        # Build summary line
        if [ "$exit_code" -eq 0 ]; then
          summary="Clean compile — no violations"
        else
          summary="Found $violations violation(s)"
        fi
        echo "summary=$summary" >> "$GITHUB_OUTPUT"

        # Step summary
        echo "### keel Compile Results" >> "$GITHUB_STEP_SUMMARY"
        if [ "$exit_code" -eq 0 ]; then
          echo "Clean compile — no violations" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Found $violations violation(s)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $exit_code

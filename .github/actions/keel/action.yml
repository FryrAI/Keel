name: "keel - Structural Code Enforcement"
description: "Install keel, provision its graph from cache, annotate the diff, and keep one sticky review comment on the PR"

# The one CI recipe. `keel init` scaffolds a workflow that calls this action and
# nothing else, so there is a single place to fix when the recipe changes —
# before this, keel's own scaffold ran `curl install.sh` + `keel map --strict`
# and a user following it never saw keel's annotations at all.

branding:
  icon: "shield"
  color: "blue"

inputs:
  version:
    description: "keel version to use (default: latest)"
    required: false
    default: "latest"
  mode:
    description: "'review' (two-sided graph diff + sticky comment), 'compile' (compile --changed), or 'auto': review on pull_request, compile otherwise"
    required: false
    default: "auto"
  args:
    description: "Full keel arguments, overriding `mode` entirely (e.g. 'compile --since HEAD~5'). Runs exactly this one command: no second review pass, no sticky comment"
    required: false
    default: ""
  comment:
    description: "Post/update the sticky PR comment in review mode"
    required: false
    default: "true"
  github-token:
    description: "GitHub token, used to download releases and to post the sticky comment"
    required: false
    default: ${{ github.token }}

outputs:
  violation-count:
    description: "Number of annotations keel emitted"
    value: ${{ steps.run.outputs.violation-count }}
  exit-code:
    description: "keel exit code"
    value: ${{ steps.run.outputs.exit-code }}
  summary:
    description: "Human-readable summary of results"
    value: ${{ steps.run.outputs.summary }}
  graph-sha:
    description: "The commit the graph used for this run describes"
    value: ${{ steps.graph.outputs.graph-sha }}

runs:
  using: "composite"
  steps:
    - name: Install keel
      shell: bash
      env:
        KEEL_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/entrypoint.sh install

    # Referenced by full repo path rather than `./.github/actions/keel-graph`:
    # a relative `uses:` inside a composite action resolves against the CALLING
    # repository's workspace, which does not contain this action.
    - name: Provision the graph
      id: graph
      uses: FryrAI/Keel/.github/actions/keel-graph@v0

    - name: Run keel
      id: run
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        ARGS: ${{ inputs.args }}
        EVENT_NAME: ${{ github.event_name }}
        GRAPH_SHA: ${{ steps.graph.outputs.graph-sha }}
        # Scratch space outside the checkout: `keel review` diffs the working
        # tree, and CI output files have no business appearing in it.
        ANNOTATIONS: ${{ runner.temp }}/keel-annotations.txt
        REVIEW: ${{ runner.temp }}/keel-review.txt
      run: |
        set -uo pipefail

        mode="$MODE"
        if [ "$mode" = "auto" ]; then
          if [ "$EVENT_NAME" = "pull_request" ]; then mode="review"; else mode="compile"; fi
        fi

        # An explicit `args:` wins over `mode` — the escape hatch for anything
        # this action does not model. It becomes its OWN mode: the caller's
        # command IS the run, so the review plumbing below (a second `keel
        # review`, the sticky comment keyed on this output) must not fire on top
        # of it just because the event happened to be a pull_request.
        if [ -n "$ARGS" ]; then
          mode="custom"
          read -r -a cmd <<<"$ARGS"
        elif [ "$mode" = "review" ]; then
          cmd=(review --base "$GRAPH_SHA")
        elif [ "$mode" = "compile" ]; then
          cmd=(compile --changed)
        else
          echo "::error::unknown keel mode '$mode' (expected review, compile, or auto)"
          exit 2
        fi
        echo "mode=$mode" >>"$GITHUB_OUTPUT"

        # `--format github` makes the binary emit the annotations itself. It
        # replaced an inline interpreter heredoc that reshaped keel's JSON — an
        # undeclared runtime dependency in a tool whose Article 1 is "single
        # binary, zero runtime dependencies". Keep this step interpreter-free.
        #
        # `|| exit_code=$?`, not a bare `$?` on the next line: composite bash
        # runs with implicit -e, so an ERROR-level keel exit would kill the
        # script HERE — annotations unposted, outputs unset, sticky comment
        # skipped — and the step would go red with nothing on it to read.
        exit_code=0
        keel "${cmd[@]}" --format github >"$ANNOTATIONS" || exit_code=$?
        echo "exit-code=$exit_code" >>"$GITHUB_OUTPUT"

        # The annotations ARE the output: echoing them is what posts them.
        cat "$ANNOTATIONS"

        # One annotation per violation; a clean run prints nothing at all —
        # and `grep -c` exits 1 on that zero-match file, so without `|| true`
        # the implicit -e turned every CLEAN run into a silent exit-1 failure
        # (100% of pushes: `compile --changed` diffs a fresh checkout's
        # working tree against HEAD, which is empty by construction).
        violations="$(grep -c '^::' "$ANNOTATIONS" || true)"
        echo "violation-count=$violations" >>"$GITHUB_OUTPUT"

        if [ "$exit_code" -eq 0 ] && [ "$violations" -eq 0 ]; then
          summary="Clean — no violations"
        else
          summary="Found $violations violation(s)"
        fi
        echo "summary=$summary" >>"$GITHUB_OUTPUT"

        # In review mode the sticky comment is the report; the plain rendering
        # is produced here so the comment step is pure plumbing.
        if [ "$mode" = "review" ]; then
          # A review that could not run must leave no body behind: an empty
          # file reads as "clean", and the comment would say so untruthfully.
          rm -f "$REVIEW"
          keel review --base "$GRAPH_SHA" >"$REVIEW" || rm -f "$REVIEW"
        else
          {
            echo "### keel ${cmd[0]}"
            echo ""
            echo "$summary"
            if [ "$violations" -gt 0 ]; then
              echo ""
              echo '```'
              cat "$ANNOTATIONS"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
        fi

        exit $exit_code

    - name: Quality snapshot
      # One reading per merge on the default branch — the time axis `keel
      # quality --trend` reads. Push-only and default-branch-only: a pull
      # request's graph describes the merge base, not the merged result, so
      # snapshotting one would record a state that never existed.
      #
      # `always()`: a merge that carried violations is still a merge, and the
      # series must not develop holes wherever the build went red.
      #
      # Honest limitation: the graph cache is keyed on the exact commit, so a
      # push run always starts from a graph built for THIS commit and the
      # series accumulates in the developer's local `.keel/graph.db` (which
      # `keel map` deliberately does not clear), not in CI. This step is what
      # puts the reading in front of a human on every merge.
      if: ${{ always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      shell: bash
      run: |
        set -uo pipefail

        if [ ! -f .keel/graph.db ]; then
          echo "keel: no graph to measure — skipping the quality snapshot"
          exit 0
        fi

        # ~10ms of graph work. `keel quality` never gates, and neither does
        # this step: a failed measurement must not turn a green merge red.
        reading="$(keel quality --snapshot --llm)" || reading=""
        if [ -n "$reading" ]; then
          echo "$reading"
          {
            echo "### keel quality"
            echo ""
            echo '```'
            echo "$reading"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
        fi

    - name: Sticky review comment
      # `always()`: a red compile in review mode must still leave the report on
      # the PR, and a fork's read-only token must never turn into a red run.
      if: ${{ always() && inputs.comment == 'true' && steps.run.outputs.mode == 'review' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: ${{ github.action_path }}/sticky_comment.sh "${{ runner.temp }}/keel-review.txt"
